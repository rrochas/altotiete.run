<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alto Tietê Run | Calendário</title>
  <meta name="description" content="Calendário de corridas no Alto Tietê." />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="top">
    <div class="wrap">
      <img class="logo" src="logo.png" alt="Alto Tietê Run" />
      <div class="headtext">
        <h1>Calendário de Corridas</h1>
        <p id="updated">—</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="status" id="status"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Cidade</th>
            <th>Evento</th>
            <th>Distâncias</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <footer class="foot">
      <small>© <span id="year"></span> Alto Tietê Run</small>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script src="app.js"></script>
</body>
</html>
